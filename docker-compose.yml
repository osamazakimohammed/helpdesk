services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - DATABASE_URL=postgres://postgres:postgres@pgbouncer:6432/helpdesk?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=change-this-super-secret-jwt-key-in-production-use-strong-entropy
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=support@helpdesk.local
    depends_on:
      - pgbouncer
      - redis
      - mailpit

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=helpdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_NAME=helpdesk
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
    ports:
      - "6432:6432"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI for emails
      - "1025:1025" # SMTP server

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
